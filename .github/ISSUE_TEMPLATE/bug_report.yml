name: Bug report
description: Report a reproducible issue using synthetic data only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, real schemas, customer data, private prompts or internal screenshots.
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the command or supported question and the observed result.
      placeholder: talk-data-demo ask "Compare refund rate by region" --json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: data_boundary
    attributes:
      label: Data boundary confirmation
      options:
        - This report contains synthetic data only
    validations:
      required: true
