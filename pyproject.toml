[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "talk-to-your-data-demo"
version = "0.1.0"
description = "A zero-secret, synthetic-data demo for asking business questions and inspecting the exact SQL before execution."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Emre Kaan Yılmaz" }]
keywords = ["nl2sql", "data-engineering", "sqlite", "analytics", "ai", "demo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "ruff>=0.11,<1",
]

[project.urls]
Homepage = "https://github.com/emrekaany/talk-to-your-data-demo"
Issues = "https://github.com/emrekaany/talk-to-your-data-demo/issues"

[project.scripts]
talk-data-demo = "talk_to_your_data_demo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
talk_to_your_data_demo = ["web/index.html"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
